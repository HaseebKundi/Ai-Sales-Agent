services:
  - type: web
    name: ai-support-agent
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      - key: CONFIDENCE_THRESHOLD
        value: "0.55"
      - key: PYTHON_VERSION
        value: 3.11.9
